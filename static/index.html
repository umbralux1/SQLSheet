<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: Excel-like workbook — schema rail left, editor + formula bar + grid right, sheet tabs + status bar at the bottom */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --fg:#1d2320; --muted:#68736d; --line:#d5dbd6; --line-strong:#b9c2bb;
  --head:#eaeeea; --head-active:#cfe3d6; --accent:#1f7a4d; --accent-fg:#ffffff; --sel:rgba(31,122,77,.12);
  --new:#d8f2df; --chg:#fbf0c6; --null:#9aa49e; --err:#b3261e; --err-bg:#fbe9e7; --kw:#1f5fa8; --wavy:#c48a00; --str:#9a4a12;
  --f-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b211e; --fg:#e3e9e5; --muted:#93a099; --line:#2c3531; --line-strong:#3c4842;
  --head:#222a26; --head-active:#24432f; --accent:#4cc283; --accent-fg:#0d1a12; --sel:rgba(76,194,131,.16);
  --new:#1f3e2a; --chg:#3d3518; --null:#66736c; --err:#ff8a80; --err-bg:#3a1f1d; --kw:#7fb4ff; --wavy:#e0b341; --str:#f0a46b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b211e; --fg:#e3e9e5; --muted:#93a099; --line:#2c3531; --line-strong:#3c4842;
  --head:#222a26; --head-active:#24432f; --accent:#4cc283; --accent-fg:#0d1a12; --sel:rgba(76,194,131,.16);
  --new:#1f3e2a; --chg:#3d3518; --null:#66736c; --err:#ff8a80; --err-bg:#3a1f1d; --kw:#7fb4ff; --wavy:#e0b341; --str:#f0a46b; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}   /* hidden always wins over a component's display */
/* show <>, !=, >=, <= exactly as typed: no programming ligatures (≠ ≥ ≤) in a SQL course */
body,code,pre,textarea,input{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--f-display);font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
/* phones: the task, editor and result come first; tables and the task list follow, the list folded */
.lessons-toggle{display:none}
@media (max-width:820px){
  .layout>.main{order:-1}
  .lessons-toggle{display:block;width:100%;font-size:13px}
  #lessons-box:not(.open) .lessons{display:none}
  #schema-box{display:none}   /* no room for the table list on a phone */
}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* sidebar */
aside{display:grid;gap:12px}
.side{padding:12px;display:grid;gap:8px}
.tbl{border-top:1px solid var(--line);padding-top:8px}
.tbl:first-of-type{border-top:0;padding-top:0}
.tbl button.tname{all:unset;cursor:pointer;font-family:var(--f-mono);font-weight:600;font-size:13px;display:flex;justify-content:space-between;width:100%}
.tbl button.tname small{color:var(--muted);font-weight:400}
.cols{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cols button{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:3px;padding:1px 6px;cursor:pointer}
.cols button i{color:var(--muted);font-style:normal}
.cols button:hover,.tbl button.tname:hover{color:var(--accent)}
.lessons{display:grid;gap:4px}
.lessons button{all:unset;cursor:pointer;padding:6px 8px;border-radius:4px;display:grid;gap:1px}
.lessons button b{font-weight:600;font-size:13px}
.lessons button span{font-size:12px;color:var(--muted)}
.lessons button:hover,.lessons button[aria-current="true"]{background:var(--sel)}
.lessons button:focus-visible,.tbl button.tname:focus-visible{outline:2px solid var(--accent)}

/* editor */
.main{display:grid;gap:0;overflow:hidden}
.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--head)}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);border-radius:4px;padding:5px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:hover{filter:brightness(1.05)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin-left:auto}
.lesson-note{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg);background:var(--panel)}
.lesson-note:empty{display:none}
.lesson-note code{font-family:var(--f-mono);font-size:12px;background:var(--head);padding:0 4px;border-radius:3px}
/* the task statement: its own card, a little larger, easy to spot */
.lesson-note .task-text{margin:8px 0 10px;padding:12px 16px 12px 18px;max-width:72ch;
  font-size:clamp(17px,1.4vw,19px);line-height:1.45;font-weight:500;color:var(--fg);text-wrap:pretty;
  background:linear-gradient(90deg,var(--sel),transparent 65%),var(--panel);
  border:1px solid var(--line-strong);border-left:4px solid var(--accent);border-radius:8px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px -14px rgba(0,0,0,.35)}
.lesson-note .task-text code{font-size:.86em;padding:1px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.lesson-note .task-text b{font-weight:700}
.editor{position:relative;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;border-bottom:1px solid var(--line)}
.editor pre,.editor textarea{margin:0;padding:10px 12px 10px 46px;min-height:120px;white-space:pre-wrap;word-break:break-word;font:inherit;tab-size:2}
.editor pre{pointer-events:none;color:var(--fg)}
.editor textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;background:transparent;color:transparent;caret-color:var(--fg);outline:none}
.editor textarea::selection{background:var(--sel);color:transparent}
.editor .gutter{position:absolute;left:0;top:0;bottom:0;width:34px;background:var(--head);border-right:1px solid var(--line);color:var(--muted);font-size:11px;text-align:right;padding:10px 6px 0 0;overflow:hidden;white-space:pre}
.editor:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.update-banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:calc(100% - 32px);padding:10px 12px 10px 16px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.paste-note{position:absolute;right:10px;bottom:10px;z-index:4;max-width:calc(100% - 60px);padding:6px 10px;border-radius:6px;background:var(--fg);color:var(--bg);font-family:var(--f-body);font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.kw{color:var(--kw);font-weight:600}.kw.lc{text-decoration:underline wavy var(--wavy);text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-skip-ink:none}
.linkbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);border-radius:3px;padding:1px 8px;margin-left:6px;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.st{color:var(--str)}.nu{color:var(--accent)}.cm{color:var(--muted);font-style:italic}

/* formula bar */
.fbar{display:grid;grid-template-columns:72px 28px minmax(0,1fr);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px}
.fbar>div{padding:5px 8px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .fx{color:var(--muted);font-style:italic;text-align:center;font-family:Georgia,serif}
.fbar .val{border-right:0}
.msg{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.msg.err{background:var(--err-bg);color:var(--err);font-family:var(--f-mono);font-size:12.5px}
.msg.ok{color:var(--muted)}
.msg .lg{display:inline-flex;gap:4px;align-items:center;margin-left:10px}
.msg .sw{width:10px;height:10px;border:1px solid var(--line-strong);display:inline-block}

/* grid */
.gridwrap{overflow:auto;max-height:min(62vh,560px);min-height:200px;background:var(--panel);outline:none}
table.sheet{border-collapse:separate;border-spacing:0;font-family:var(--f-body);font-size:13px;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 8px;height:24px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.sheet thead th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--muted);font-weight:500;font-size:12px;text-align:center;cursor:pointer;min-width:84px}
.sheet th.corner{left:0;z-index:3;min-width:44px;width:44px;cursor:default}
.sheet tbody th{position:sticky;left:0;z-index:1;background:var(--head);color:var(--muted);font-weight:500;font-size:12px;text-align:right;min-width:44px;cursor:pointer}
.sheet tr.hdr td{font-weight:600;background:var(--panel)}
.sheet tr.hdr td small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);font-family:var(--f-mono);line-height:1}
.sheet td.n{text-align:right}
.sheet td.null{color:var(--null);font-style:italic}
.sheet tr.new td{background:var(--new)}
.sheet tr.chg td{background:var(--chg)}
.sheet td.insel{background:var(--sel)}
.sheet td.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.sheet th.on{background:var(--head-active);color:var(--fg)}
.sheet td.empty,.sheet th.empty{background:transparent}
.sheet tr.pass td:not(.empty){background:var(--new)}
.sheet tr.fail td:not(.empty):not(.wt):not(.wf){color:var(--muted)}
.sheet td.wt,.sheet td.wf{text-align:center;font-weight:700;font-size:14px}
.sheet td.wt{color:var(--accent)} .sheet td.wf{color:var(--err)}
.sheet td.w0{border-left:2px solid var(--line-strong)}
.sheet td.wfin{border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.sheet tr.hdr td.wfin{background:var(--head-active)}
.msg.why-msg{color:var(--fg)}
.msg .wt{color:var(--accent)} .msg .wf{color:var(--err)}
.why-key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.why-key code{font-family:var(--f-mono);font-size:12px}
.why-note{margin-top:6px;color:var(--muted)}
.why-row{margin-top:8px}
.why-btn[aria-pressed="true"]{background:var(--head-active);border-color:var(--accent)}
.why-btn:disabled{opacity:.5;cursor:default}


/* tabs + status */
.tabs{display:flex;gap:0;border-top:1px solid var(--line);background:var(--head);overflow-x:auto}
.tabs button{font:inherit;font-size:12.5px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 14px;cursor:pointer;white-space:nowrap;font-family:var(--f-mono)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.status{display:flex;flex-wrap:wrap;gap:4px 18px;padding:5px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.status b{color:var(--fg);font-weight:600}
.status .agg{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.boot{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* wrong answer in a lesson */
.msg .dumb{margin-top:8px;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3vw,28px);line-height:1.2;color:var(--err);animation:dumb-shake .5s ease-in-out both}
@keyframes dumb-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.msg .dumb{animation:none}}

/* prediction tasks */
.main>*,.lesson-note{min-width:0}   /* wide tables scroll inside their box instead of stretching the card */
.predict-mode .ribbon,.predict-mode .editor,.predict-mode .fbar{display:none}
.lesson-note pre.cond{margin:8px 0;padding:8px 12px;max-width:72ch;font-family:var(--f-mono);font-size:13.5px;line-height:1.5;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;white-space:pre-wrap;word-break:break-word}
.lesson-note .pwrap{width:fit-content;max-width:100%;overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.ptable{border-collapse:separate;border-spacing:0;width:auto;font-size:13px;font-variant-numeric:tabular-nums}
.ptable tr>:last-child{border-right:0}.ptable tbody tr:last-child td{border-bottom:0}
.ptable th,.ptable td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 10px;height:26px;white-space:nowrap}
.ptable th{text-align:left;font-weight:600;background:var(--head);color:var(--muted)}
.ptable th small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);font-family:var(--f-mono);line-height:1;margin-top:2px}
.ptable .g{background:var(--head);color:var(--muted);font-weight:500;font-size:12px;text-align:center;min-width:36px;padding:3px 6px}
.ptable td.n{text-align:right}
.ptable td.null{color:var(--null);font-style:italic}
.ptable tr[data-emp]{cursor:pointer}
.ptable tr[data-emp]:hover td{background:var(--head)}
.ptable tr[data-emp].on td{background:var(--sel)}
.ptable tr[data-emp]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ptable .tick{display:inline-grid;place-items:center;width:18px;height:18px;border:2px solid var(--line-strong);border-radius:4px;vertical-align:middle}
.ptable tr.on .tick{background:var(--accent);border-color:var(--accent)}
.ptable tr.on .tick::after{content:'✓';color:var(--accent-fg);font-size:12px;font-weight:700;line-height:1}
.lesson-note .yn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}
.lesson-note .yn .btn{min-width:88px;font-size:14px;padding:7px 18px}
.lesson-note .yn .btn.chosen{outline:2px solid var(--accent);outline-offset:1px}
.lesson-note .pcount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson-note .pexplain{margin:4px 0 6px;padding:10px 12px;border-radius:6px;font-size:14px;line-height:1.5;max-width:80ch}
.lesson-note .pexplain.good{background:var(--new)}
.lesson-note .pexplain.bad{background:var(--err-bg)}
.lesson-note .pexplain code{font-size:.9em}
.lesson-note .pexplain .tnote{color:var(--muted)}
.lesson-note .rw-hint{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.tv-true{color:var(--accent)} .tv-false{color:var(--err)} .tv-null{color:var(--null)}
.lesson-note .given{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 8px;font-family:var(--f-mono);font-size:13.5px}
.lesson-note .tvb{font-family:var(--f-mono);font-weight:700}
.ttable th,.ttable td{text-align:center;font-family:var(--f-mono);padding:4px 14px}
.ttable th.tc{color:var(--fg)}
.ttable .t0{border-left:2px solid var(--line-strong)}
.ttable td.tvv{font-weight:600}
.ttable td.tcell{cursor:pointer;font-weight:700;min-width:96px;user-select:none;color:var(--muted)}
.ttable td.tcell.tv-true{color:var(--accent)} .ttable td.tcell.tv-false{color:var(--err)} .ttable td.tcell.tv-null{color:var(--null)}
.ttable td.tcell:hover{background:var(--head)}
.ttable td.tcell.done{cursor:default}
.ttable td.tcell.miss{box-shadow:inset 0 0 0 2px var(--err)}
.ttable td.tcell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:520px){.ttable th,.ttable td{padding:4px 7px;font-size:12px}.ttable td.tcell{min-width:64px}}
</style>
<style>
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;margin-left:auto;align-self:center}
.lang button{font:inherit;font-size:12px;font-weight:600;border:0;background:var(--panel);color:var(--muted);padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hint{margin-left:auto}
.semi{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:12px;font-weight:600;border:0;background:var(--panel);color:var(--muted);padding:4px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.msg .warn{display:block;margin-top:6px;padding:4px 8px;background:var(--chg);color:var(--fg);border-radius:3px;font-family:var(--f-body)}
.msg .warn code,.msg.err code{font-family:var(--f-mono);font-weight:600}
/* collaboration */
.collab{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.collab .dot{width:8px;height:8px;border-radius:50%;background:var(--null);flex:none}
.collab .dot.live{background:var(--accent)}
.collab .dot.offline{background:var(--err)}
.collab .peers{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.collab .peer{display:inline-flex;align-items:center;gap:5px;color:var(--fg);font-weight:600}
.collab .peer i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.collab .peer small{color:var(--muted);font-weight:400}
.collab .alone{font-style:italic}
.collab .me{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.collab input{font:inherit;font-size:12px;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);border-radius:3px;padding:2px 6px;width:130px}
.collab input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.collab .btn{padding:3px 10px;font-size:12px}
.editor pre.carets{position:absolute;inset:0;color:transparent;overflow:visible}
.rc{position:relative;display:inline-block;width:0;height:1.3em;vertical-align:text-bottom;border-left:2px solid var(--c);margin-left:-1px;margin-right:-1px}
.rl{position:absolute;bottom:100%;left:-2px;background:var(--c);color:#fff;font:600 10px/1.4 var(--f-body);padding:0 5px;border-radius:3px 3px 3px 0;white-space:nowrap;z-index:3}
.rl.idle{opacity:.55}
.rs{border-radius:2px}
/* navigation + lesson mode */
.nav{display:inline-flex;gap:2px;margin-left:auto;align-self:center}
.nav a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:4px}
.nav a:hover{color:var(--fg);background:var(--head)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--sel)}
.nav a:focus-visible{outline:2px solid var(--accent)}
header .lang{margin-left:0}
.lessons-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lessons-head a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
.lessons-head a:hover{text-decoration:underline}
.lessons button.solved b{color:var(--accent)}
.lessons .extra-head{margin-top:14px;padding:7px 8px;border-radius:4px;background:var(--sel);color:var(--accent);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.msg .win .win-actions{display:inline-flex;gap:8px;flex-wrap:wrap}

.msg .good,.msg .bad{display:block;margin-top:6px;padding:5px 8px;border-radius:3px;font-family:var(--f-body)}
.msg .good{background:var(--new);color:var(--fg)}
.msg .win{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;padding:14px 16px;border-radius:8px;
  background:linear-gradient(135deg,var(--new),var(--sel));border:1.5px solid var(--accent);color:var(--fg);font-family:var(--f-body);
  animation:win-pop .5s cubic-bezier(.2,1.5,.4,1) both}
.msg .win .medal{font-size:34px;line-height:1;animation:win-bounce 1s ease-out .15s both}
.msg .win .words{display:grid;gap:4px;flex:1 1 220px;min-width:0}
.msg .win .words b{font-family:var(--f-display);font-size:19px;line-height:1.2;color:var(--accent)}
.msg .win .words small{font-size:13px}
.msg .win .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.msg .win .dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent);background:transparent}
.msg .win .dots i.on{background:var(--accent)}
.msg .win .dots i.now{box-shadow:0 0 0 3px var(--sel);animation:win-bounce .8s ease-out .3s both}

canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:100}

.msg .bad{background:var(--err-bg);color:var(--err)}

.lesson-note details.intro summary::-webkit-details-marker{display:none}

function lessonList(){

  const sectionStart=k=>{for(let i=k;i>=0;i--) if(COURSE_LESSON.tasks[i].section) return i; return -1};
  // section theory + worked example, folded until the student opens it
  const introOf=k=>{const i=sectionStart(k), t=i>=0?COURSE_LESSON.tasks[i]:null; if(!t||!t.intro) return '';

let runCount=0;

let pickState=new Set(), lastExplain=null, SEED_DB=null;
function resetPredict(){ pickState=new Set(); lastExplain=null; truthState={}; truthShown=false; }
function seedDB(){                       // the lesson's original data, untouched by the student's queries
  if(!COURSE_LESSON||typeof SQL==='undefined'||!SQL) return null;
  if(!SEED_DB){ SEED_DB=new SQL.Database(); SEED_DB.run(COURSE_LESSON.seed); }

function predictTableName(t){ return t.table||COURSE_LESSON.tables[0] }
function predictTable(cols,rows,pickable,active,types){
  const cell=v=>v===null?'<td class="null">NULL</td>':typeof v==='number'?`<td class="n">${v}</td>`:`<td>${esc(String(v))}</td>`;
  let h=`<table class="ptable"><thead><tr>${pickable?'<th class="g"></th>':''}${cols.map((c,j)=>`<th>${esc(c)}<small>${esc((types&&types[j])||'')}</small></th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{
    const on=pickable&&active&&pickState.has(r[0]);
    h+=pickable?`<tr data-emp="${r[0]}" class="${on?'on':''}" role="checkbox" aria-checked="${on}" tabindex="0"><td class="g"><span class="tick"></span></td>${r.map(cell).join('')}</tr>`
               :`<tr>${r.map(cell).join('')}</tr>`;
  });
  return h+'</tbody></table>';
}
/* ---------- logic tasks: "what does this expression return?" (value) and truth tables (truth) ---------- */
let truthState={}, truthShown=false;        // "row,col" -> 'true' | 'false' | 'null'
const sqlVal=v=>v===1?'TRUE':v===0?'FALSE':'NULL';
function truthRows(t){                    // every combination of the variables, TRUE first
  const vals=t.nulls?[1,0,null]:[1,0];
  let rows=[[]]; t.vars.forEach(()=>{ rows=rows.flatMap(r=>vals.map(v=>[...r,v])) });
  return rows;
}
function valueSQL(t){                     // the query that shows the real value in the grid
  const given=t.given?Object.entries(t.given):[];
  return given.length?`SELECT ${t.expr} AS result\nFROM (SELECT ${given.map(([k,v])=>`${sqlVal(v)} AS ${k}`).join(', ')});`
                     :`SELECT ${t.expr} AS result;`;
}
function truthSQL(t){
  return `WITH v(${t.vars.join(', ')}) AS (VALUES ${truthRows(t).map(r=>'('+r.map(sqlVal).join(', ')+')').join(', ')})\n`+
         `SELECT ${t.vars.join(', ')}, ${t.cols.map(c=>`${c} AS "${c}"`).join(', ')}\nFROM v;`;
}
function truthExpected(t){                // [[1|0|null, …] per row], worked out by SQLite itself
  const d=seedDB(); if(!d) return null;
  const sql=`WITH v(${t.vars.join(', ')}) AS (VALUES ${truthRows(t).map(r=>'('+r.map(sqlVal).join(', ')+')').join(', ')}) `+
            `SELECT ${t.cols.map(c=>`CASE WHEN (${c}) THEN 1 WHEN NOT (${c}) THEN 0 END`).join(', ')} FROM v`;
  try{ return d.exec(sql)[0].values }catch(e){ return null }
}
const tvCls=v=>v===1||v==='true'?'tv-true':v===0||v==='false'?'tv-false':v===null||v==='null'?'tv-null':'';
function logicBlock(t,active){
  if(t.kind==='value'){
    const given=t.given?`<div class="given">${Object.entries(t.given).map(([k,v])=>`<code>${esc(k)} = <b class="${tvCls(v)}">${sqlVal(v)}</b></code>`).join('')}</div>`:'';
    const opts=['true','false',...(t.nulls?['null']:[])];
    return `<pre class="cond">${esc(t.expr)}</pre>${given}<div class="yn">${opts.map(v=>`<button class="btn tvb ${tvCls(v)}" type="button" data-yn="${v}">${v.toUpperCase()}</button>`).join('')}</div><div class="pfeed" id="pfeed"></div>`;
  }
  const rows=truthRows(t);
  let h=`<div class="pwrap"><table class="ptable ttable"><thead><tr>${t.vars.map(v=>`<th>${esc(v)}</th>`).join('')}${t.cols.map((c,j)=>`<th class="tc${j===0?' t0':''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    h+='<tr>'+r.map(v=>`<td class="tvv ${tvCls(v)}">${sqlVal(v)}</td>`).join('')+
      t.cols.map((c,j)=>{ const s=active?truthState[i+','+j]:''; return `<td class="tcell${j===0?' t0':''} ${tvCls(s)}" data-cell="${i},${j}" role="button" tabindex="0" aria-label="${esc(c)}">${s?s.toUpperCase():'?'}</td>` }).join('')+'</tr>';
  });
  return h+`</tbody></table></div><div class="yn"><button class="btn primary" type="button" id="truth-check">${esc(L.checkPick)}</button><span class="pcount">${esc(t.nulls?L.truthHint3:L.truthHint)}</span></div><div class="pfeed" id="pfeed"></div>`;
}
function toggleCell(key){
  if(truthShown) return;
  const t=COURSE_LESSON.tasks[activeLesson], order=['','true','false',...(t.nulls?['null']:[])];
  const next=order[(order.indexOf(truthState[key]||'')+1)%order.length];
  if(next) truthState[key]=next; else delete truthState[key];
  const td=document.querySelector(`#note [data-cell="${key}"]`);
  if(td){ td.textContent=next?next.toUpperCase():'?'; td.classList.remove('tv-true','tv-false','tv-null'); if(next) td.classList.add(tvCls(next)); }
}
function truthCells(t){ return truthRows(t).map((_,i)=>t.cols.map((_,j)=>truthState[i+','+j]||'')) }
async function submitTruth(){

/* ---------- rewrite tasks: the same condition in another form (De Morgan) ---------- */
const sqlLit=v=>typeof v==='string'?`'${v.replace(/'/g,"''")}'`:v===null?'NULL':String(v);
function rewriteCases(t){                 // the same cases the server compares on
  if(t.vars) return {names:t.vars, rows:truthRows(t)};
  const names=Object.keys(t.domain); let rows=[[]];
  names.forEach(n=>{ rows=rows.flatMap(r=>t.domain[n].map(v=>[...r,v])) });
  return {names,rows};
}
function rewriteSQL(t,mine){              // both conditions side by side, for every case
  const {names,rows}=rewriteCases(t);
  return `WITH v(${names.join(', ')}) AS (VALUES ${rows.map(r=>'('+r.map(sqlLit).join(', ')+')').join(', ')})\n`+
         `SELECT ${names.join(', ')},\n       ${t.expr} AS original,\n       ${mine} AS yours\nFROM v;`;
}
function runRewrite(t,src){
  const mine=src.replace(/;+\s*$/,'').trim(); if(!mine) return;
  if(/^select\b/i.test(mine)){ showMsg('err',L.rewriteNoSelect); return; }
  if(mine.includes(';')){ showMsg('err',L.rewriteError); return; }
  run(rewriteSQL(t,mine));
  if($('msg').classList.contains('err')) return;     // run() already shows the SQLite error
  checkRewrite(mine);
}
async function checkRewrite(mine){
  const k=activeLesson, myRun=runCount;
  const res=await predictCheck({answer:mine}); if(!res||myRun!==runCount||k!==activeLesson) return;
  if(res.ok){ predictOutcome(true,res.explain,null,true); return; }
  const why=res.reason==='differs'?L.rewriteDiffers(res.rows):res.reason==='form'?(COURSE_LESSON.tasks[k].form==='no_not'?L.rewriteFormNot:L.rewriteForm):L.rewriteError;
  $('msg').insertAdjacentHTML('beforeend',`<div class="dumb" role="status">you're so dumb dumb</div><span class="bad">${esc(why)}</span>`);
}
function predictBlock(k){
  const t=COURSE_LESSON.tasks[k]; if(!t.kind) return '';
  if(t.kind==='rewrite') return `<pre class="cond">${esc(t.expr)}</pre><div class="rw-hint">${esc(L.rewriteHint)}</div><div class="pfeed" id="pfeed"></div>`;
  if(t.kind==='value'||t.kind==='truth') return logicBlock(t,k===activeLesson);
  const table=predictTableName(t), active=k===activeLesson;
  const cond=t.kind==='pick'?`<pre class="cond">SELECT * FROM ${esc(table)}\nWHERE ${esc(t.condition)};</pre>`:`<pre class="cond">WHERE ${esc(t.condition)}</pre>`;
  const db=seedDB(); if(!db) return cond;
  const res=db.exec(`SELECT * FROM "${table}"`)[0];
  const types=(db.exec(`PRAGMA table_info("${table}")`)[0]||{values:[]}).values.map(v=>String(v[2]).toLowerCase());
  if(t.kind==='row'){
    const r=res.values.find(v=>v[0]===t.row);
    return cond+`<div class="pwrap">${predictTable(res.columns,r?[r]:[],false,active,types)}</div>
      <div class="yn"><button class="btn" type="button" data-yn="yes">${esc(L.yes)}</button><button class="btn" type="button" data-yn="no">${esc(L.no)}</button></div><div class="pfeed" id="pfeed"></div>`;
  }
  return cond+`<div class="pwrap">${predictTable(res.columns,res.values,true,active,types)}</div>
    <div class="yn"><button class="btn primary" type="button" id="pick-check">${esc(L.checkPick)}</button><span class="pcount" id="pcount">${esc(L.marked(active?pickState.size:0))}</span></div><div class="pfeed" id="pfeed"></div>`;
}
function setPredictMode(i){

function togglePick(emp){

async function predictCheck(body){

    const r=await fetch('api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson:COURSE_LESSON.id,task:k,...body})});
    if(!r.ok) return null;

function predictOutcome(ok,explain,note,noWhy){

async function checkTask(r){
  if(!COURSE_LESSON||activeLesson<0) return;
  if(COURSE_LESSON.tasks[activeLesson].kind) return;   // prediction tasks are checked by their own buttons
  const k=activeLesson, myRun=runCount;
  let res;
  try{
    const resp=await fetch('api/check',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lesson:COURSE_LESSON.id,task:k,columns:r.columns,rows:r.values})});
    if(!resp.ok) return;
    res=await resp.json();
  }catch(e){return}
  if(myRun!==runCount||k!==activeLesson) return;      // a newer query or another task is on screen now
  const msg=$('msg');
  if(!res.ok){
    const bad=res.reason==='columns'?L.wrongCols(res.expected.join(', '),r.columns.join(', '))
            :res.reason==='rows'?L.wrongRows(res.expected,r.values.length):L.wrongVals;
    msg.insertAdjacentHTML('beforeend',`<div class="dumb" role="status">you're so dumb dumb</div><span class="bad">${esc(bad)}</span>`);
    return;
  }
  COURSE_PROGRESS.add(COURSE_LESSON.id,COURSE_LESSON.tasks[k].id);
  celebrate(k);
  renderLessons(k);
}
function celebrate(k){
  // main tasks and extra practice are celebrated (and counted) separately
  const T=COURSE_LESSON.tasks, ex=!!T[k].extra, group=[...T.keys()].filter(i=>!!T[i].extra===ex), n=group.length;
  const ids=new Set(COURSE_PROGRESS.get(COURSE_LESSON.id)), done=i=>ids.has(T[i].id);
  const doneCount=group.filter(done).length, all=doneCount>=n;
  const after=group.filter(i=>i>k), nextOpen=after.find(i=>!done(i))??group.find(i=>!done(i));
  const dots=group.map(i=>`<i class="${done(i)?'on':''}${i===k?' now':''}"></i>`).join('');
  const nextLesson=COURSE.lessons.slice(COURSE.lessons.findIndex(x=>x.id===COURSE_LESSON.id)+1).find(x=>x.available&&(x.track||'base')===(COURSE_LESSON.track||'base'));
  const extras=[...T.keys()].filter(i=>T[i].extra), extraOpen=extras.find(i=>!done(i));
  const finishMain=(nextLesson?`<a class="btn primary" href="./?lesson=${nextLesson.id}&task=1">${esc(L.nextLesson)}</a>`:`<a class="btn primary" href="lessons">${esc(L.allLessons)}</a>`)+
    (extraOpen!=null?` <button class="btn" data-lesson-go="${extraOpen}">${esc(L.tryExtra)}</button>`:'');
  const action=all?(ex?`<a class="btn primary" href="lessons">${esc(L.allLessons)}</a>`:`<span class="win-actions">${finishMain}</span>`)
    :after.length?`<button class="btn primary" data-lesson-go="${after[0]}">${esc(L.nextTask)}</button>`
    :`<button class="btn primary" data-lesson-go="${nextOpen}">${esc(L.toUnsolved)}</button>`;
  const title=all?(ex?L.extraComplete:L.lessonComplete):L.praise[Math.floor(Math.random()*L.praise.length)];
  const line=all?(ex?L.extraProud(n):L.proud(n)):(ex?L.extraSolvedOf(doneCount,n):L.solvedOf(doneCount,n));
  $('msg').insertAdjacentHTML('beforeend',`<div class="win${all?' big':''}" role="status"><span class="medal" aria-hidden="true">${all?'🏆':'🎉'}</span>
    <span class="words"><b>${esc(title)}</b><small>${esc(line)}</small><span class="dots" aria-hidden="true">${dots}</span></span>${action}</div>`);
  confetti($('msg').querySelector('.win'),all);
}
function confetti(from,big){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight; c.width=W*dpr; c.height=H*dpr;
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  const r=from?from.getBoundingClientRect():{left:W/2-50,top:H/3,width:100,height:0};
  const ox=r.left+Math.min(60,r.width/2), oy=r.top+r.height/2;
  const colors=['#1f7a4d','#4cc283','#f2c94c','#e5484d','#0b84f3','#d6409f','#e8590c'];
  const parts=[...Array(big?260:140)].map((_,i)=>{
    const sx=big&&i%2?W-ox:ox, a=(-Math.PI/2)+(Math.random()-.5)*(big?2.6:1.9), v=(big?11:9)+Math.random()*7;
    return {x:sx,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length]};
  });
  const t0=performance.now(), life=big?2600:1900;
  (function frame(t){
    const age=t-t0; g.clearRect(0,0,W,H);
    for(const p of parts){ p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      g.save(); g.globalAlpha=Math.max(0,1-age/life); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); }
    if(age<life) requestAnimationFrame(frame); else c.remove();
  })(t0);
  setTimeout(()=>c.remove(),life+500);   // clean up even if the tab was in the background
}

/* ---------- semicolon mode ----------
   Always strict: a query without ; at the end is not run. (There used to be a
   Strict / Hint switch; it was removed, so saved or shared choices are ignored.) */
const semiMode='strict';
function applySemi(){}
function setSemi(){}
function missingSemi(src){
  const s=src.replace(/'(?:[^']|'')*'/g,"''").replace(/\/\*[\s\S]*?\*\//g,'').replace(/--[^\n]*/g,'').trim();
  return s.length>0&&!s.endsWith(';');
}
/* ---------- keyword case ---------- */
const TOKEN_RE=/(--[^\n]*)|('(?:[^']|'')*'?)|(\b\d+(?:\.\d+)?\b)|([^'\-\d]+|[\s\S])/g;
function lcKeywords(src){
  const seen=new Map(); let m; TOKEN_RE.lastIndex=0;
  while((m=TOKEN_RE.exec(src))){ if(m[4]) (m[4].match(KW)||[]).forEach(w=>{if(w!==w.toUpperCase()&&!seen.has(w.toUpperCase()))seen.set(w.toUpperCase(),w)}) }
  return [...seen.values()];
}
function upperKeywords(src){
  let out='', m; TOKEN_RE.lastIndex=0;
  while((m=TOKEN_RE.exec(src))) out+=m[4]?m[4].replace(KW,w=>w.toUpperCase()):m[0];
  return out;
}
function addCaseTip(src){
  const words=lcKeywords(src); if(!words.length) return;
  const list=words.slice(0,5).map(w=>`<code>${esc(w)}</code> → <code>${esc(w.toUpperCase())}</code>`).join(', ')+(words.length>5?', …':'');
  $('msg').insertAdjacentHTML('beforeend',`<span class="warn" id="case-tip">${esc(L.caseTip)} ${list}<button class="linkbtn" id="fix-case">${esc(L.caseFix)}</button></span>`);
  $('fix-case').onclick=()=>{ta.value=upperKeywords(ta.value);highlight();const t=$('case-tip');t&&t.remove();ta.focus()};
}

/* ---------- highlighting ---------- */
const KW=/\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|DISTINCT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DROP|ALTER|ADD|PRIMARY|KEY|REFERENCES|INTEGER|TEXT|REAL|DATE|ASC|DESC|LIKE|BETWEEN|CASE|WHEN|THEN|ELSE|END|UNION|ALL|EXISTS|COUNT|SUM|AVG|MIN|MAX|ROUND|WITH|DEFAULT|UNIQUE|INDEX|VIEW|UPPER|LOWER|LENGTH|COALESCE)\b/gi;
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function highlight(){
  const src=ta.value;
  let out='', re=/(--[^\n]*)|('(?:[^']|'')*'?)|(\b\d+(?:\.\d+)?\b)|([^'\-\d]+|[\s\S])/g, m;
  while((m=re.exec(src))){
    if(m[1]) out+=`<span class="cm">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="st">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="nu">${m[3]}</span>`;
    else out+=esc(m[4]).replace(KW,w=>w===w.toUpperCase()?`<span class="kw">${w}</span>`:`<span class="kw lc">${w}</span>`);
  }
  hl.innerHTML=out+'\n';
  gut.textContent=src.split('\n').map((_,i)=>i+1).join('\n');
  saveCode(src);
}

/* ---------- helpers ---------- */
function colLetter(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function tables(){const r=db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY rowid");return r.length?r[0].values.map(v=>v[0]):[]}
function tableInfo(t){const r=db.exec(`PRAGMA table_info("${t}")`);return r.length?r[0].values.map(v=>({name:v[1],type:v[2]||'',pk:v[5]})):[]}
function snapshot(t){const m=new Map();try{const r=db.exec(`SELECT rowid,* FROM "${t}"`);if(r.length)r[0].values.forEach(v=>m.set(v[0],JSON.stringify(v.slice(1))))}catch(e){}return m}
function fmtNum(v){return v.toLocaleString(L.locale,{useGrouping:false,maximumFractionDigits:4})}   // like Excel's General format: 1997, 74990, 12.5

/* ---------- run ---------- */
const marksByTable={};
function run(given){
  runCount++;
  whyOn=false; whyResult=null; whySrc=null; updateWhyBtn();
  const src=(typeof given==='string'?given:ta.value).trim(); if(!src) return;
  const rw=COURSE_LESSON&&activeLesson>=0&&COURSE_LESSON.tasks[activeLesson];
  if(rw&&rw.kind==='rewrite'&&!src.startsWith('WITH v(')){ runRewrite(rw,src); return; }   // the editor holds a condition, not a query
  const noSemi=missingSemi(src);
  if(noSemi&&semiMode==='strict'){showMsg('err',L.semiErr);$('st-time').textContent='';return}
  const dml=[...src.matchAll(/\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM)\s+"?(\w+)"?/gi)].map(m=>m[1]);
  const snaps={}; dml.forEach(t=>{if(tables().includes(t)) snaps[t]=snapshot(t)});
  const t0=performance.now();
  let res;
  try{ res=db.exec(src); }
  catch(e){ showMsg('err',L.error+e.message+hintFor(e.message)); $('st-time').textContent=''; return; }
  const ms=(performance.now()-t0).toFixed(1), changed=db.getRowsModified();
  $('st-time').innerHTML=`${L.time}: <b>${ms} ${L.ms}</b>`;
  let touched=null;
  for(const t of Object.keys(snaps)){
    const before=snaps[t], after=snapshot(t), mk={};
    let del=0; before.forEach((_,k)=>{if(!after.has(k))del++});
    after.forEach((v,k)=>{if(!before.has(k))mk[k]='new';else if(before.get(k)!==v)mk[k]='chg'});
    marksByTable[t]={marks:mk,deleted:del}; touched=t;
  }
  renderSchema();
  if(res.length){
    const r=res[res.length-1];
    lastResult={cols:r.columns,rows:r.values,types:guessTypes(r.values,r.columns.length)}; whySrc=src;
    renderTabs(); openTab('__result');
    showMsg('ok',L.ok(r.values.length));
    checkTask(r);   // in a lesson every Run also checks the answer
  }else if(touched){
    const m=marksByTable[touched], n=Object.values(m.marks), a=n.filter(x=>x==='new').length, c=n.filter(x=>x==='chg').length;
    renderTabs(); openTab(touched);
    showMsg('ok',L.changed(changed)+(a?L.added(a):'')+(c?L.updated(c):'')+(m.deleted?L.deleted(m.deleted):''),true);
  }else{
    // a SELECT that matched no rows: sql.js returns nothing, so read the column names ourselves
    let cols=[];
    try{for(const st of db.iterateStatements(src)){cols=st.getColumnNames();st.free()}}catch(e){cols=[]}
    if(cols.length){
      const r={columns:cols,values:[]};
      lastResult={cols,rows:[],types:guessTypes([],cols.length)}; whySrc=src;
      renderTabs(); openTab('__result');
      showMsg('ok',L.ok(0));
      checkTask(r);
    }else{
    renderTabs(); if(!tables().includes(tab)&&tab!=='__result') openTab('__result'); else openTab(tab);
    showMsg('ok',L.done);
    }
  }
  if(noSemi) addSemiTip();
  addCaseTip(src);
  updateWhyBtn();
}
function hintFor(m){
  if(/no such table/.test(m)) return L.hNoTable;
  if(/no such column/.test(m)) return L.hNoCol;
  if(/syntax error/.test(m)) return L.hSyntax;
  return '';
}
function showMsg(kind,text,legend){
  const el=$('msg'); el.className='msg '+kind; el.textContent=text;
  if(legend) el.insertAdjacentHTML('beforeend',`<span class="lg"><i class="sw" style="background:var(--new)"></i>${L.legNew}</span><span class="lg"><i class="sw" style="background:var(--chg)"></i>${L.legChg}</span>`);
}
function guessTypes(rows,n){const t=[];for(let c=0;c<n;c++){t[c]=rows.length&&rows.every(r=>r[c]===null||typeof r[c]==='number')&&rows.some(r=>r[c]!==null)?'number':'text'}return t}
function typeLabel(t){return t==='number'?L.number:t==='text'?L.text:t}

/* ---------- tabs & views ---------- */

/* ---------- grid ---------- */
const MIN_COLS=8, MIN_ROWS=18, MAX_ROWS=1000;
function renderGrid(){
  const nc=Math.max(view.cols.length,MIN_COLS), shown=view.rows.slice(0,MAX_ROWS), nr=Math.max(shown.length+1,MIN_ROWS);
  let h='<table class="sheet"><thead><tr><th class="corner"></th>';
  for(let c=0;c<nc;c++) h+=`<th data-col="${c}">${colLetter(c)}</th>`;
  h+='</tr></thead><tbody>';
  for(let r=0;r<nr;r++){
    let cls='';
    if(r===0&&view.cols.length) cls='hdr';
    else if(r>0&&view.rowids){const m=view.marks[view.rowids[r-1]];if(m)cls=m}
    h+=`<tr class="${cls}"><th data-row="${r}">${r+1}</th>`;
    for(let c=0;c<nc;c++){
      if(r===0){
        if(c<view.cols.length) h+=`<td data-r="0" data-c="${c}" class="${whyCls(c)}" title="${esc(view.cols[c])}${view.why&&c>=view.why.from?' · '+esc(view.types[c]||''):''}">${esc(view.cols[c])}<small>${esc(typeLabel(view.types[c]||''))}</small></td>`;
        else h+=`<td class="empty" data-r="0" data-c="${c}"></td>`;
        continue;
      }
      const row=shown[r-1];
      if(!row||c>=view.cols.length){h+=`<td class="empty" data-r="${r}" data-c="${c}"></td>`;continue}
      const v=row[c];
      if(view.why&&c>=view.why.from&&v!==null){ h+=`<td class="${v?'wt':'wf'} ${whyCls(c)}" data-r="${r}" data-c="${c}">${v?'✓':'✗'}</td>`; continue }
      if(v===null&&view.why&&c>=view.why.from){ h+=`<td class="null ${whyCls(c)}" data-r="${r}" data-c="${c}">NULL</td>`; continue }
      if(v===null) h+=`<td class="null" data-r="${r}" data-c="${c}">NULL</td>`;
      else if(typeof v==='number') h+=`<td class="n" data-r="${r}" data-c="${c}">${fmtNum(v)}</td>`;
      else if(v instanceof Uint8Array) h+=`<td data-r="${r}" data-c="${c}">[BLOB ${v.length} ${L.blob}]</td>`;
      else h+=`<td data-r="${r}" data-c="${c}" title="${esc(String(v))}">${esc(String(v))}</td>`;
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  grid.innerHTML=h;
  const total=view.rows.length;
  $('st-rows').innerHTML=view.cols.length?`${L.rows}: <b>${total}</b>${total>MAX_ROWS?L.shown(MAX_ROWS):''} · ${L.cols}: <b>${view.cols.length}</b>`:L.empty;
  paintSel();
}
function whyCls(c){ return !view.why||c<view.why.from?'':(c===view.why.from?'w0 ':'')+(c===view.why.fin?'wfin':'') }
function cellVal(r,c){if(r===0)return view.cols[c];const row=view.rows[r-1];return row?row[c]:undefined}
function paintSel(){
  grid.querySelectorAll('.insel,.cur').forEach(e=>e.classList.remove('insel','cur'));
  grid.querySelectorAll('th.on').forEach(e=>e.classList.remove('on'));
  const a=anchor||cur, r1=Math.min(a.r,cur.r), r2=Math.max(a.r,cur.r), c1=Math.min(a.c,cur.c), c2=Math.max(a.c,cur.c);
  const nums=[];
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){
    const td=grid.querySelector(`td[data-r="${r}"][data-c="${c}"]`); if(!td) continue;
    td.classList.add(r===cur.r&&c===cur.c?'cur':'insel');
    const v=cellVal(r,c); if(r>0&&typeof v==='number') nums.push(v);
  }
  for(let c=c1;c<=c2;c++){const th=grid.querySelector(`th[data-col="${c}"]`);th&&th.classList.add('on')}
  for(let r=r1;r<=r2;r++){const th=grid.querySelector(`th[data-row="${r}"]`);th&&th.classList.add('on')}
  const ref=colLetter(cur.c)+(cur.r+1);
  $('namebox').textContent=(anchor&&(anchor.r!==cur.r||anchor.c!==cur.c))?`${colLetter(c1)}${r1+1}:${colLetter(c2)}${r2+1}`:ref;
  const v=cellVal(cur.r,cur.c);
  $('fval').textContent=v===null?'NULL':v===undefined?'':String(v);
  const cnt=(r2-r1+1)*(c2-c1+1);
  if(nums.length>1||(cnt>1&&nums.length)){
    const sum=nums.reduce((a,b)=>a+b,0);
    $('st-agg').innerHTML=`${L.avg}: <b>${fmtNum(+(sum/nums.length).toFixed(2))}</b><span>${L.count}: <b>${nums.length}</b></span><span>${L.sum}: <b>${fmtNum(sum)}</b></span>`;
  }else $('st-agg').innerHTML='';
  const td=grid.querySelector(`td[data-r="${cur.r}"][data-c="${cur.c}"]`);
  if(td){const g=grid.getBoundingClientRect(),b=td.getBoundingClientRect();
    if(b.bottom>g.bottom)grid.scrollTop+=b.bottom-g.bottom; if(b.top<g.top+26)grid.scrollTop-=g.top+26-b.top;
    if(b.right>g.right)grid.scrollLeft+=b.right-g.right; if(b.left<g.left+44)grid.scrollLeft-=g.left+44-b.left;}
}
let dragging=false;
grid.addEventListener('mousedown',e=>{
  const td=e.target.closest('td'), thc=e.target.closest('thead th[data-col]'), thr=e.target.closest('tbody th[data-row]');

/* ---------- "Explain the condition": every part of WHERE becomes a ✓/✗ column ----------
   The last SELECT that ran is split into its comparisons (A, B, C…) and the AND / OR / NOT
   that join them. All rows of the table are shown (no WHERE), one column per part, the
   inner parts first, the whole condition last. Rows that pass are green. Headers spell
   out the brackets SQL puts in by itself: A OR B AND C is shown as A OR (B AND C). */
let whySrc=null, whyOn=false, whyResult=null;
function sqlTokens(src){
  const out=[], re=/\s+|--[^\n]*|\/\*[\s\S]*?(?:\*\/|$)|'(?:[^']|'')*'?|"(?:[^"]|"")*"?|`[^`]*`?|\[[^\]]*\]?|\d+(?:\.\d+)?(?:e[+-]?\d+)?|\.\d+|[A-Za-z_][\w$]*|<=|>=|<>|!=|==|\|\||<<|>>|./gi;
  let m;
  while((m=re.exec(src))){
    const v=m[0], s=m.index, e=s+v.length;
    if(/^\s|^--|^\/\*/.test(v)) continue;
    const t=/^'/.test(v)?'str':/^["`[]/.test(v)?'qid':/^[\d.]/.test(v)&&v!=='.'?'num':/^[A-Za-z_]/.test(v)?'word':'op';
    out.push({t,v,u:v.toUpperCase(),s,e});
  }
  return out;
}
function lastSelect(src){                 // tokens of the last SELECT statement in the editor text
  const tk=sqlTokens(src), stmts=[[]];
  tk.forEach(x=>{ if(x.v===';') stmts.push([]); else stmts[stmts.length-1].push(x) });
  for(let i=stmts.length-1;i>=0;i--) if(stmts[i].length) return stmts[i][0].u==='SELECT'?stmts[i]:null;
  return null;
}
function parseCond(tk,src){
  let p=0;
  const at=u=>p<tk.length&&tk[p].t==='word'&&tk[p].u===u;
  const span=(s,e)=>src.slice(s,e).replace(/\s+/g,' ').trim();
  function leaf(){
    const s0=p; let depth=0, between=false;
    for(;p<tk.length;p++){
      const x=tk[p];
      if(x.v==='('||(x.t==='word'&&x.u==='CASE')){depth++;continue}
      if(x.v===')'||(x.t==='word'&&x.u==='END')){ if(depth===0) break; depth--; continue }
      if(depth) continue;
      if(x.t==='word'&&x.u==='BETWEEN'){between=true;continue}
      if(x.t==='word'&&x.u==='AND'&&between){between=false;continue}
      if(x.t==='word'&&(x.u==='AND'||x.u==='OR')) break;
    }
    if(p===s0) throw 0;
    return {op:'leaf',s:tk[s0].s,e:tk[p-1].e};
  }
  function primary(){
    if(p<tk.length&&tk[p].v==='('){
      const save=p, s=tk[p].s; p++;
      try{
        const kid=or();
        if(p<tk.length&&tk[p].v===')'){
          p++;
          const nx=tk[p];
          if(!nx||nx.v===')'||(nx.t==='word'&&(nx.u==='AND'||nx.u==='OR'))) return {op:'()',kid,s,e:tk[p-1].e};
        }
      }catch(e){}
      p=save;                              // "(salary + bonus) > 60000": the bracket is part of a comparison
    }
    return leaf();
  }
  function not(){
    if(at('NOT')){ const s=tk[p].s; p++; const kid=not(); return {op:'NOT',kid,s,e:kid.e} }
    return primary();
  }
  function chain(op,next){
    const kids=[next()];
    while(at(op)){ p++; kids.push(next()) }
    return kids.length===1?kids[0]:{op,kids,s:kids[0].s,e:kids[kids.length-1].e};
  }
  function and(){ return chain('AND',not) }
  function or(){ return chain('OR',and) }
  const tree=or();
  if(p!==tk.length) throw 0;
  (function text(n){ n.sql=src.slice(n.s,n.e); n.txt=span(n.s,n.e); (n.kids||[]).forEach(text); if(n.kid) text(n.kid) })(tree);
  return tree;
}
function splitSelect(st){                 // top-level clauses of one SELECT
  const at={}; let depth=0;
  st.forEach((x,i)=>{
    if(x.v==='(') depth++; else if(x.v===')') depth--;
    else if(!depth&&x.t==='word'&&['FROM','WHERE','GROUP','HAVING','ORDER','LIMIT','WINDOW','UNION','EXCEPT','INTERSECT'].includes(x.u)&&at[x.u]==null) at[x.u]=i;
  });
  if(at.FROM==null||at.WHERE==null||at.WHERE<at.FROM) return null;
  if(at.GROUP!=null||at.HAVING!=null||at.UNION!=null||at.EXCEPT!=null||at.INTERSECT!=null||at.WINDOW!=null) return null;
  const end=Math.min(...['ORDER','LIMIT'].map(k=>at[k]!=null&&at[k]>at.WHERE?at[k]:st.length));
  return {sel:st.slice(1,at.FROM), from:st.slice(at.FROM+1,at.WHERE), where:st.slice(at.WHERE+1,end),
          order:at.ORDER!=null?st.slice(at.ORDER,at.LIMIT!=null&&at.LIMIT>at.ORDER?at.LIMIT:st.length):[]};
}
function splitExpr(st){                   // SELECT <one expression> [AS name] [FROM …]: the logic lesson's queries
  let depth=0, from=-1;
  for(let i=1;i<st.length;i++){
    const x=st[i];
    if(x.v==='(') depth++; else if(x.v===')') depth--;
    else if(depth) continue;
    else if(x.v===','&&from<0) return null;
    else if(x.t==='word'&&['WHERE','GROUP','HAVING','ORDER','LIMIT','UNION','EXCEPT','INTERSECT','WINDOW'].includes(x.u)) return null;
    else if(x.t==='word'&&x.u==='FROM'&&from<0) from=i;
  }
  let sel=st.slice(1,from<0?st.length:from);
  if(sel.length>2&&sel[sel.length-2].t==='word'&&sel[sel.length-2].u==='AS') sel=sel.slice(0,-2);
  if(!sel.length||sel[0].v==='*') return null;
  return {expr:sel, from:from<0?[]:st.slice(from+1), order:[]};
}
function whyPlan(src){
  const st=lastSelect(src||''); if(!st) return null;
  const S=(a)=>a.length?src.slice(a[0].s,a[a.length-1].e):'';
  const q=splitSelect(st);
  if(q&&q.where.length&&q.from.length){
    let tree; try{ tree=parseCond(q.where,src) }catch(e){ return null }
    return {q,tree,S};
  }
  const x=splitExpr(st); if(!x) return null;
  let tree; try{ tree=parseCond(x.expr,src) }catch(e){ return null }
  if(tree.op==='leaf'&&!/[=<>]|\b(?:IS|IN|LIKE|BETWEEN|TRUE|FALSE)\b/i.test(tree.txt)) return null;   // not a condition
  return {q:x,tree,S,expr:true};
}
const tvName=v=>v===1?'TRUE':v===0?'FALSE':'NULL';
function whyBuild(src){
  const plan=whyPlan(src); if(!plan) return null;
  const {q,tree,S}=plan;
  // letters for the comparisons, in the order they are written
  const leaves=[]; (function walk(n){ if(n.op==='leaf') leaves.push(n); else if(n.kid) walk(n.kid); else n.kids.forEach(walk) })(tree);
  // circled numbers, so they can't be mixed up with the sheet's column letters A, B, C
  leaves.forEach((n,i)=>n.letter=i<20?String.fromCharCode(0x2460+i):'('+(i+1)+')');
  // a header with every bracket shown; the ones SQL adds by itself are marked "implicit"
  let implicit=false;
  const real=n=>n.op==='()'?real(n.kid):n;
  function label(n,parent){
    if(n.op==='leaf') return n.letter;
    if(n.op==='()'){ const k=real(n); return k.op==='AND'||k.op==='OR'?'('+label(k,null)+')':label(k,null) }
    const s=n.op==='NOT'?'NOT '+label(n.kid,n):n.kids.map(k=>label(k,n)).join(' '+n.op+' ');
    if(parent&&(parent.op==='AND'||parent.op==='OR')){ implicit=true; return '('+s+')' }
    return s;
  }
  const cols=[];
  leaves.forEach(n=>cols.push({n,head:(leaves.length>1?n.letter+' ':'')+n.txt,sub:''}));
  (function post(n){
    if(n.op==='leaf') return;
    if(n.op==='()'){ post(n.kid); return }
    if(n.kid) post(n.kid); else n.kids.forEach(post);
    cols.push({n,head:label(n,null),sub:n.op==='AND'?L.whyAnd:n.op==='OR'?L.whyOr:L.whyNot});
  })(tree);
  const last=cols[cols.length-1]; last.fin=true;
  label(tree,null);                        // sets "implicit" for the whole condition
  const logic=cols.map((c,i)=>`CASE WHEN (${c.n.sql}) THEN 1 WHEN NOT (${c.n.sql}) THEN 0 END AS "__w${i}"`).join(', ');
  let base, info=null, dataCols=[], dataTypes=[];
  if(plan.expr){
    // one expression: no table, or the given values in a FROM (…) (shown as columns)
    base=q.from.length?`SELECT *, ${logic} FROM ${S(q.from)}`:`SELECT ${logic}`;
  }else{
    // which data columns to show
    const ft=q.from.filter(x=>!(x.t==='word'&&x.u==='AS'));
    const simple=(ft.length===1||ft.length===2)&&ft.every(x=>x.t==='word'||x.t==='qid')&&!ft.some(x=>['JOIN','ON','USING'].includes(x.u));
    const tname=simple?ft[0].v.replace(/^["`[]|["`\]]$/g,''):null;
    let dataSql;
    info=tname&&tables().includes(tname)?tableInfo(tname):null;
    if(info&&info.length){
      const ref=new Set(q.where.filter(x=>x.t==='word'||x.t==='qid').map(x=>x.v.replace(/^["`[]|["`\]]$/g,'').toLowerCase()));
      const pick=info.filter((c,i)=>c.pk||i===0);
      const nm=info.find(c=>/name/i.test(c.name)&&!pick.includes(c)); if(nm) pick.push(nm);
      info.forEach(c=>{ if(ref.has(c.name.toLowerCase())&&!pick.includes(c)) pick.push(c) });
      const keep=info.filter(c=>pick.includes(c));          // in table order
      dataSql=keep.map(c=>`"${c.name}"`).join(', ');
      dataCols=keep.map(c=>c.name); dataTypes=keep.map(c=>c.type.toLowerCase());
    }else{
      info=null; dataSql=S(q.sel);
    }
    base=`SELECT ${dataSql}, ${logic} FROM ${S(q.from)}`;
  }
  let r=null;
  for(const sql of q.order.length?[base+' '+S(q.order),base]:[base]){ try{ r=db.exec(sql)[0]; break }catch(e){ r=undefined } }
  if(r===undefined) return null;
  const vals=r?r.values:[], nData=(r?r.columns.length:0)-cols.length;
  if(!info){ dataCols=r?r.columns.slice(0,nData):[]; dataTypes=guessTypes(vals.map(v=>v.slice(0,nData)),nData) }
  const pass=vals.map(v=>v[v.length-1]===1);
  return {
    cols:[...dataCols,...cols.map(c=>c.head)],
    types:[...dataTypes,...cols.map(c=>c.sub)],
    rows:vals,
    why:{from:nData,fin:nData+cols.length-1},
    rowids:vals.map((_,i)=>i),
    marks:Object.fromEntries(pass.map((ok,i)=>[i,ok?'pass':'fail'])),
    passed:pass.filter(Boolean).length, implicit, hasNull:vals.some(v=>v.slice(nData).some(x=>x===null)), legend:leaves.length>1?leaves.map(n=>`${n.letter} ${n.txt}`):[],
    expr:!!plan.expr, value:plan.expr&&vals.length===1?vals[0][vals[0].length-1]:undefined
  };
}
function updateWhyBtn(){
  const ok=!!whyPlan(whySrc);
  document.querySelectorAll('.why-btn').forEach(b=>{
    b.disabled=!ok&&!whyOn;
    b.textContent=whyOn?L.whyBack:L.why;
    b.title=ok||whyOn?L.whyTitle:L.whyNeed;
    b.setAttribute('aria-pressed',whyOn);
  });
}
function toggleWhy(){
  if(whyOn){ whyOn=false; whyResult=null; openTab('__result'); showMsg('ok',L.ok(lastResult?lastResult.rows.length:0)); updateWhyBtn(); return }
  const w=whyBuild(whySrc);
  if(!w){ showMsg('err',L.whyFail); updateWhyBtn(); return }
  whyOn=true; whyResult=w; renderTabs(); openTab('__result');
  const el=$('msg'); el.className='msg ok why-msg';
  el.innerHTML=(w.expr&&w.value!==undefined?`<b>${esc(L.whyValue(tvName(w.value)))}</b> `:`<b>${esc(L.whyPassed(w.passed,w.rows.length))}</b> <span class="lg"><i class="sw" style="background:var(--new)"></i>${esc(L.whyLegPass)}</span>`)+
    `<span class="lg"><b class="wt">✓</b>&nbsp;${esc(L.whyYes)}</span><span class="lg"><b class="wf">✗</b>&nbsp;${esc(L.whyNo)}</span>`+
    (w.legend.length?`<div class="why-key">${w.legend.map(s=>`<code>${esc(s)}</code>`).join('')}</div>`:'')+
    (w.hasNull?`<div class="why-note">${esc(L.whyNull)}</div>`:'')+
    (w.implicit?`<div class="why-note">${esc(L.whyImplicit)}</div>`:'');
  updateWhyBtn();
}

/* ---------- boot ---------- */
function resetDb(){db&&db.close();db=new SQL.Database();db.run(seedSQL());for(const k in marksByTable)delete marksByTable[k];lastResult=null;tab='__result';whyOn=false;whyResult=null;whySrc=null}
$('run').onclick=()=>run();
document.addEventListener('click',e=>{ const b=e.target.closest('.why-btn'); if(b&&!b.disabled) toggleWhy() });
['msg','note'].forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('[data-lesson-go]');if(b&&!b.disabled)loadLesson(+b.dataset.lessonGo)}));
$('note').addEventListener('click',e=>{
  const r=e.target.closest('[data-emp]'); if(r){ togglePick(+r.dataset.emp); return; }
  const y=e.target.closest('[data-yn]'); if(y){ answerRow(y.dataset.yn); return; }

  if(e.target.closest('#pick-check')) submitPick(); else if(e.target.closest('#pick-reveal')) revealPick();
  else if(e.target.closest('#truth-check')) submitTruth(); else if(e.target.closest('#truth-reveal')) revealTruth();
});
$('note').addEventListener('keydown',e=>{ const r=e.target.closest('[data-emp],[data-cell]'); if(r&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); r.click(); } });
$('lessons-toggle').onclick=()=>{const box=$('lessons-box'),open=box.classList.toggle('open');$('lessons-toggle').setAttribute('aria-expanded',open);renderToggle()};
function renderToggle(){const open=$('lessons-box').classList.contains('open');$('lessons-toggle').textContent=open?L.hideTasks:(COURSE_LESSON?L.showTasks(COURSE_LESSON.tasks.length):L.showLessons)}
$('reset').onclick=()=>{resetDb();renderSchema();clearResult();showMsg('ok',L.resetDone+' '+L.ready)};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
applyLang();
$('msg').textContent=L.loading;
grid.innerHTML=`<div class="boot">${L.preparing}</div>`;
(async()=>{
  try{
    if(typeof initSqlJs!=='function') throw new Error(L.engineMissing);
    SQL=await initSqlJs();
    resetDb();
    let draft=null;try{draft=localStorage.getItem('sqlt-draft-'+lang)}catch(e){}
    if(draft&&!COURSE_LESSON){ta.value=draft;highlight();renderLessons(-1);renderSchema();clearResult()}
    else loadLesson(defaultLesson());
    if(COURSE_LESSON) loadTeacherAnswers();
  }catch(e){showMsg('err',L.bootFail(e.message));grid.innerHTML=`<div class="boot">${L.engineDown}</div>`}
})();

<script type="module">
/* ================= real-time collaboration ================= */
import * as Y from 'https://esm.sh/yjs@13.6.20';

const COLORS=['#e5484d','#0b84f3','#d6409f','#e8590c','#8e4ec6','#0f9d8a','#a16207','#3e63dd'];
const bar=document.getElementById('collab');
const overlay=document.getElementById('carets');

if(/^https?:$/.test(location.protocol)) start();

function start(){
  /* ---------- room & identity ---------- */
  const params=new URLSearchParams(location.search);

  if(!room){room=Math.random().toString(36).slice(2,8);params.set('room',room);history.replaceState(null,'',location.pathname+'?'+params+location.hash)}

  const doc=new Y.Doc(), ytext=doc.getText('sql'), cid=String(doc.clientID);

  let myColor=''; try{myColor=sessionStorage.getItem('sqlt-color')||''}catch(e){}
  if(!myColor){myColor=COLORS[doc.clientID%COLORS.length];try{sessionStorage.setItem('sqlt-color',myColor)}catch(e){}}
  const me={name:myName,color:myColor};
  // each page has its own shared state, so the room on the server is room + page
  const ctx=COURSE_LESSON?'L'+COURSE_LESSON.id:'free';
  const peers=new Map();
  let ws=null, state='connecting', synced=false, applyingRemote=false, epoch=null, lastSeq=0;
  const live=()=>synced&&ws&&ws.readyState===1;

  bar.hidden=!!COURSE_LESSON;   // task pages show no room bar; people are invited from the Lessons page
  const nameInput=document.getElementById('collab-name');
  nameInput.value=me.name;
  nameInput.addEventListener('input',()=>{me.name=nameInput.value.trim()||me.name;try{sessionStorage.setItem('sqlt-name',me.name)}catch(e){};renderPresence();sendPresence()});
  document.getElementById('collab-copy').onclick=copyLink;

  /* ---------- hooks into the page ---------- */
  const orig={applyLang:window.applyLang, highlight:window.highlight, paintSel:window.paintSel};
  window.applyLang=function(){orig.applyLang();renderPresence()};
  window.highlight=function(){ if(synced&&!applyingRemote) pushLocal(); orig.highlight(); renderCarets(); sendPresence(); };
  window.paintSel=function(){ orig.paintSel(); drawRemoteSels(); sendPresence(); };
  ta.addEventListener('input',()=>{ if(synced&&!applyingRemote) pushLocal(); renderCarets(); sendPresence(); });
  ['keyup','mouseup','focus','blur','select'].forEach(ev=>ta.addEventListener(ev,sendPresence));
  document.addEventListener('selectionchange',()=>{ if(document.activeElement===ta) sendPresence(); });

  /* ---------- shared actions: send to the server, apply when it echoes back ---------- */
  function emit(action){ ws.send(JSON.stringify({type:'event',cid,...action})) }
  function emitTask(i){ emit({kind:'lesson',i,id:COURSE_LESSON&&COURSE_LESSON.tasks[i]?COURSE_LESSON.tasks[i].id:null}) }

  /* ---------- everyone in the room must run the same version of the course ---------- */
  const courseVersion=(()=>{ const s=JSON.stringify((window.COURSE?COURSE.lessons:[]).map(l=>(l.tasks||[]).map(t=>t.id)));
    let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return String(h) })();
  function showUpdateBanner(){
    if(document.getElementById('update-banner')) return;
    const b=document.createElement('div'); b.id='update-banner'; b.className='update-banner'; b.setAttribute('role','alert');
    b.innerHTML=`<span>${esc(L.siteUpdated)}</span><button class="btn primary" type="button">${esc(L.reload)}</button>`;
    b.querySelector('button').onclick=()=>location.reload();
    document.body.appendChild(b);
  }
  document.addEventListener('click',e=>{
    if(!live()) return;
    const t=e.target.closest('.why-btn,#run,#reset,.lang button,.seg button,#tabs button,.tname,#lessons button,[data-lesson-go],#note [data-emp],#note [data-yn],#note [data-cell],#pick-check,#pick-reveal,#truth-check,#truth-reveal');
    if(!t) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if(t.classList.contains('why-btn')){ if(!t.disabled) emit({kind:'why'}); }
    else if(t.id==='run') emit({kind:'run',src:ta.value});
    else if(t.id==='reset') emit({kind:'reset'});
    else if(t.dataset.lang) emit({kind:'lang',lang:t.dataset.lang});
    else if(t.closest('#tabs')) emit({kind:'tab',id:t.dataset.id});
    else if(t.classList.contains('tname')) emit({kind:'tab',id:t.childNodes[0].textContent.trim()});
    else if(t.dataset.cell||t.id==='truth-check'||t.id==='truth-reveal'){
      const id=COURSE_LESSON&&COURSE_LESSON.tasks[activeLesson]?COURSE_LESSON.tasks[activeLesson].id:null;
      emit({kind:'predict',id,op:t.dataset.cell?'cell':t.id==='truth-check'?'tcheck':'treveal',cell:t.dataset.cell});
    }
    else if(t.dataset.emp||t.dataset.yn||t.id==='pick-check'||t.id==='pick-reveal'){
      const id=COURSE_LESSON&&COURSE_LESSON.tasks[activeLesson]?COURSE_LESSON.tasks[activeLesson].id:null;
      emit({kind:'predict',id,op:t.dataset.emp?'toggle':t.dataset.yn?t.dataset.yn:t.id==='pick-check'?'check':'reveal',emp:t.dataset.emp?+t.dataset.emp:undefined});
    }
    else if(t.dataset.lessonGo) emitTask(+t.dataset.lessonGo);
    else emitTask(t.dataset.i!=null?+t.dataset.i:[...t.parentElement.children].indexOf(t));
  },true);
  document.addEventListener('keydown',e=>{
    if(!live()||e.target!==ta) return;
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();emit({kind:'run',src:ta.value})}
  },true);

  function applyAction(a,mine){
    switch(a.kind){
      case 'init':
        if(mine) return;
        if(a.semi&&a.semi!==semiMode) setSemi(a.semi);
        if(a.lang&&a.lang!==lang){ adoptLang(a.lang); renderLessons(-1); $('note').innerHTML=''; clearResult(); }
        return;
      case 'run': run(a.src); return;
      case 'why': toggleWhy(); return;
      case 'reset': resetDb(); renderSchema(); clearResult(); showMsg('ok',L.resetDone+' '+L.ready); return;
      case 'semi': setSemi(a.mode); return;
      case 'tab': openTab(a.id); return;
      case 'lang':
        if(a.lang===lang) return;
        if(mine){ setLang(a.lang); return; }        // the author also swaps the editor text
        const k=startLesson(); adoptLang(a.lang); $('note').innerHTML=lessonList()[k].n; renderLessons(k); renderSchema(); clearResult();
        return;
      case 'lesson': {
        // find the task by its id: a position in the list differs between versions of the course
        let i=a.i;
        if(a.id&&COURSE_LESSON){ i=COURSE_LESSON.tasks.findIndex(t=>t.id===a.id); if(i<0){ showUpdateBanner(); return; } }
        if(!lessonList()[i]) return;
        if(mine){ loadLesson(i); return; }          // the author also puts the query in the editor
        activeLesson=i; resetPredict();
        $('note').innerHTML=lessonList()[i].n; renderLessons(i); renderSchema(); clearResult(); setPredictMode(i);
        return;
      }
      case 'predict': {                            // someone answered or marked a row in a prediction task
        if(!COURSE_LESSON) return;
        const i=COURSE_LESSON.tasks.findIndex(t=>t.id===a.id); if(i!==activeLesson) return;
        if(a.op==='toggle') togglePick(a.emp); else if(['yes','no','true','false','null'].includes(a.op)) answerRow(a.op);
        else if(a.op==='cell') toggleCell(a.cell); else if(a.op==='tcheck') submitTruth(); else if(a.op==='treveal') revealTruth();
        else if(a.op==='check') submitPick(); else if(a.op==='reveal') revealPick();
        return;
      }
    }
  }
  function adoptLang(next){ lang=next; try{localStorage.setItem('sqlt-lang',lang)}catch(e){}; applyLang(); resetDb(); }

  /* ---------- editor text (Yjs) ---------- */
  function pushLocal(){
    const nv=ta.value, ov=ytext.toString(); if(nv===ov) return;
    let s=0; while(s<nv.length&&s<ov.length&&nv[s]===ov[s]) s++;
    let e=0; while(e<nv.length-s&&e<ov.length-s&&nv[nv.length-1-e]===ov[ov.length-1-e]) e++;
    doc.transact(()=>{
      if(ov.length-s-e>0) ytext.delete(s,ov.length-s-e);
      if(nv.length-s-e>0) ytext.insert(s,nv.slice(s,nv.length-e));
    },'local');
  }
  doc.on('update',(update,origin)=>{ if(origin!=='remote'&&ws&&ws.readyState===1) ws.send(update) });
  ytext.observe((ev,tr)=>{
    if(tr.origin!=='remote') return;
    const map=i=>{let old=0,shift=0;for(const d of ev.delta){
      if(d.retain!=null) old+=d.retain;
      else if(d.insert!=null){const n=typeof d.insert==='string'?d.insert.length:1; if(old<i) shift+=n}
      else if(d.delete!=null){if(old<i) shift-=Math.min(d.delete,i-old); old+=d.delete}
    } return i+shift};
    const a=map(ta.selectionStart), b=map(ta.selectionEnd), dir=ta.selectionDirection;
    applyingRemote=true;
    ta.value=ytext.toString();
    if(document.activeElement===ta) ta.setSelectionRange(a,b,dir);
    orig.highlight();
    applyingRemote=false;
    renderCarets();
  });

  /* ---------- presence: editor cursor + selected cells ---------- */
  const rel=i=>Y.relativePositionToJSON(Y.createRelativePositionFromTypeIndex(ytext,i));
  const abs=j=>{try{const p=Y.createAbsolutePositionFromRelativePosition(Y.createRelativePositionFromJSON(j),doc);return p?p.index:null}catch(e){return null}};
  let presenceQueued=false;
  function sendPresence(){
    if(presenceQueued) return; presenceQueued=true;
    setTimeout(()=>{
      presenceQueued=false;
      if(!live()) return;
      const back=ta.selectionDirection==='backward';
      const anchorI=back?ta.selectionEnd:ta.selectionStart, headI=back?ta.selectionStart:ta.selectionEnd;
      ws.send(JSON.stringify({type:'presence',cid,v:courseVersion,name:me.name,color:me.color,
        focused:document.activeElement===ta,anchor:rel(anchorI),head:rel(headI),
        sel:{tab,a:anchor?{...anchor}:{...cur},c:{...cur}}}));
    },30);
  }
  function renderCarets(){
    const text=ta.value, marks=[];
    peers.forEach(p=>{
      if(!p.anchor||!p.head) return;
      let a=abs(p.anchor), h=abs(p.head); if(a==null||h==null) return;
      a=Math.min(a,text.length); h=Math.min(h,text.length);
      marks.push({s:Math.min(a,h),e:Math.max(a,h),h,p});
    });
    if(!marks.length){overlay.innerHTML='';return}
    const pts=[...new Set([0,text.length,...marks.flatMap(m=>[m.s,m.e,m.h])])].sort((x,y)=>x-y);
    let html='';
    for(let k=0;k<pts.length;k++){
      const x=pts[k];
      marks.filter(m=>m.h===x).forEach(m=>{html+=`<span class="rc" style="--c:${m.p.color}"><span class="rl${m.p.focused?'':' idle'}">${esc(m.p.name)}</span></span>`});
      if(k===pts.length-1) break;
      const y=pts[k+1], seg=esc(text.slice(x,y)), cover=marks.filter(m=>m.s<=x&&y<=m.e&&m.s<m.e).pop();
      html+=cover?`<span class="rs" style="background:${cover.p.color}33">${seg}</span>`:seg;
    }
    overlay.innerHTML=html+'\n';
  }
  function drawRemoteSels(){
    grid.querySelectorAll('.rsel').forEach(n=>n.remove());
    const table=grid.querySelector('table.sheet'); if(!table) return;
    peers.forEach(p=>{
      const s=p.sel; if(!s||s.tab!==tab) return;
      const r1=Math.min(s.a.r,s.c.r), r2=Math.max(s.a.r,s.c.r), c1=Math.min(s.a.c,s.c.c), c2=Math.max(s.a.c,s.c.c);
      const tl=grid.querySelector(`td[data-r="${r1}"][data-c="${c1}"]`), br=grid.querySelector(`td[data-r="${r2}"][data-c="${c2}"]`);
      if(!tl||!br) return;
      const box=document.createElement('div'); box.className='rsel'; box.style.setProperty('--c',p.color);
      box.style.left=(table.offsetLeft+tl.offsetLeft)+'px'; box.style.top=(table.offsetTop+tl.offsetTop)+'px';
      box.style.width=(br.offsetLeft+br.offsetWidth-tl.offsetLeft)+'px'; box.style.height=(br.offsetTop+br.offsetHeight-tl.offsetTop)+'px';
      box.innerHTML=`<span>${esc(p.name)}</span>`;
      grid.appendChild(box);
    });
  }

  /* ---------- mouse pointers, anchored to page elements ---------- */
  const pointers=new Map();
  function locate(el){
    const path=[]; let n=el;
    while(n&&n!==document.body&&!n.id){const par=n.parentElement;if(!par)break;path.unshift([...par.children].indexOf(n));n=par}
    return {id:n&&n.id?n.id:null,path};
  }
  function resolve(id,path){
    let n=id?document.getElementById(id):document.body; if(!n) return null;
    for(const i of path){const c=n.children[i]; if(!c) break; n=c}
    return n;
  }
  let lastMove=0, moveTimer=null, pending=null;
  document.addEventListener('pointermove',e=>{
    if(!live()) return;
    const el=document.elementFromPoint(e.clientX,e.clientY); if(!el||el.closest('.rptr')) return;
    const r=el.getBoundingClientRect(), loc=locate(el);
    pending={type:'pointer',cid,name:me.name,color:me.color,id:loc.id,path:loc.path,
      fx:r.width?(e.clientX-r.left)/r.width:0, fy:r.height?(e.clientY-r.top)/r.height:0};
    const now=Date.now(), flush=()=>{lastMove=Date.now();moveTimer=null;if(pending&&live())ws.send(JSON.stringify(pending));pending=null};
    if(now-lastMove>40) flush(); else if(!moveTimer) moveTimer=setTimeout(flush,40-(now-lastMove));
  });
  document.addEventListener('pointerleave',()=>{ if(live()) ws.send(JSON.stringify({type:'pointer',cid,hidden:true})) });
  function showPointer(m){
    let el=pointers.get(m.cid);
    if(m.hidden){ if(el) el.hidden=true; return; }
    const target=resolve(m.id,m.path||[]); if(!target) return;
    const r=target.getBoundingClientRect();
    if(!el){
      el=document.createElement('div'); el.className='rptr';
      el.innerHTML='<svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><path d="M1 1 L1 16 L5 12 L8 19 L11 17.5 L8 11 L14 11 Z" fill="var(--c)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg><span></span>';
      document.body.appendChild(el); pointers.set(m.cid,el);
    }
    el.hidden=false; el.style.setProperty('--c',m.color); el.querySelector('span').textContent=m.name;
    el.style.left=(r.left+window.scrollX+m.fx*r.width)+'px'; el.style.top=(r.top+window.scrollY+m.fy*r.height)+'px';
  }
  /* ---------- shared navigation: links take everyone in the room along ---------- */
  function goTo(url,announce){
    const u=new URL(url,location.href); if(u.origin!==location.origin) return;
    u.searchParams.set('room',room);
    if(announce&&live()) ws.send(JSON.stringify({type:'page',cid,kind:'go',url:u.pathname+u.search+u.hash}));
    location.href=u.href;
  }
  document.addEventListener('click',e=>{
    const a=e.target.closest('a[href]'); if(!a||a.target==='_blank'||e.metaKey||e.ctrlKey||e.shiftKey) return;
    const u=new URL(a.getAttribute('href'),location.href); if(u.origin!==location.origin) return;
    e.preventDefault(); goTo(u.href,true);
  },true);
  function dropPointer(id){const el=pointers.get(id); if(el){el.remove();pointers.delete(id)}}

  /* ---------- presence bar ---------- */
  function renderPresence(){
    const dot=document.getElementById('collab-dot'), st=document.getElementById('collab-status'), list=document.getElementById('collab-peers');
    dot.className='dot '+state;
    st.textContent=(state==='live'?L.live:state==='offline'?L.offline:L.connecting)+' · '+L.room+' '+room;
    let html=`<span class="peer" style="--c:${me.color}"><i></i>${esc(me.name)} <small>(${L.you})</small></span>`;
    peers.forEach(p=>{html+=`<span class="peer" style="--c:${p.color}"><i></i>${esc(p.name)}</span>`});
    if(!peers.size&&state==='live') html+=`<span class="alone">${esc(L.alone)}</span>`;
    list.innerHTML=html;
  }
  async function copyLink(){
    const btn=document.getElementById('collab-copy'), url=location.href;
    let ok=false;
    try{await navigator.clipboard.writeText(url);ok=true}catch(e){
      const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();
      try{ok=document.execCommand('copy')}catch(e2){} t.remove();
    }
    btn.textContent=ok?L.copied:url;
    setTimeout(()=>{btn.textContent=L.copyLink},2000);
  }

  /* ---------- connection ---------- */
  function connect(){
    state=epoch?'offline':'connecting'; synced=false; renderPresence();
    ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${encodeURIComponent(room+'~'+ctx)}?cid=${cid}`);
    ws.binaryType='arraybuffer';
    ws.onmessage=ev=>{
      if(typeof ev.data!=='string'){Y.applyUpdate(doc,new Uint8Array(ev.data),'remote');return}
      const msg=JSON.parse(ev.data);
      if(msg.type==='synced'){
        // editor text
        if(ytext.length===0&&ta.value){synced=true;pushLocal()}
        else if(ytext.toString()!==ta.value){applyingRemote=true;ta.value=ytext.toString();orig.highlight();applyingRemote=false}
        // shared actions
        if(msg.epoch!==epoch){                      // new room or first connect: rebuild from the log
          epoch=msg.epoch; lastSeq=0;
          if(msg.log.length){ resetDb(); renderSchema(); clearResult(); }
        }
        msg.log.filter(a=>a.seq>lastSeq).forEach(a=>{lastSeq=a.seq; applyAction(a,false)});
        synced=true; state='live';
        if(!msg.log.length) emit({kind:'init',lang,semi:semiMode});   // first one here sets the room's language and mode
        ws.send(Y.encodeStateAsUpdate(doc));
        renderPresence(); renderCarets(); sendPresence();
      }else if(msg.type==='event'){
        if(msg.seq<=lastSeq) return; lastSeq=msg.seq;
        applyAction(msg,msg.cid===cid);
      }else if(msg.type==='presence'&&msg.cid!==cid){
        if(msg.v!==courseVersion) showUpdateBanner();   // the other person has a different version of the site
        const known=peers.has(msg.cid); peers.set(msg.cid,msg);
        if(!known) renderPresence(); else if(peers.get(msg.cid).name!==msg.name) renderPresence();
        renderPresence(); renderCarets(); drawRemoteSels();
      }else if(msg.type==='page'&&msg.kind==='go'){
        goTo(msg.url,false);
      }else if(msg.type==='pointer'&&msg.cid!==cid){
        showPointer(msg);
      }else if(msg.type==='leave'){
        peers.delete(msg.cid); dropPointer(msg.cid); renderPresence(); renderCarets(); drawRemoteSels();
      }
    };
    ws.onclose=()=>{peers.clear();pointers.forEach((_,k)=>dropPointer(k));state='offline';synced=false;renderPresence();renderCarets();drawRemoteSels();setTimeout(connect,2000)};
  }

  /* wait until the SQL engine has booted so my starting text is in place */
  (function waitBoot(){ if(typeof db!=='undefined'&&db) connect(); else setTimeout(waitBoot,100) })();
}
</script>
