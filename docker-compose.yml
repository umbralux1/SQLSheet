# PostgreSQL for local development: `make db`. Students' databases are disposable, so nothing is kept on disk.
services:
  postgres:
    image: postgres:18
    container_name: sql-sheet-postgres
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5544:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
